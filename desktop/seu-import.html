<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"><title>东南大学课表 · 登录并选择学期</title>
<style>html,body{margin:0;background:#101e30;color:#e6f2ff;font:13px 'Microsoft YaHei UI',sans-serif}header{padding:10px 15px;box-sizing:border-box;height:230px;overflow:auto}strong{font-weight:500}p{margin:5px 0;color:#aac5dc;font-size:12px}.row{display:flex;align-items:center;gap:10px;margin:8px 0}.status-row #status{flex:1;min-width:0;overflow-wrap:anywhere}button,select,input{border:1px solid #325570;border-radius:7px;background:#1b3450;color:#ecf6ff;padding:7px 10px;font:inherit;box-sizing:border-box}button{white-space:nowrap;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#166a97}select{max-width:430px;min-width:220px}input[type=checkbox]{margin:0 6px 0 0;accent-color:#54c6ff}#status.error,#summer-note{color:#ffb6b6}#term-note{color:#aac5dc}label{display:inline-flex;align-items:center;gap:6px}#confirmation{display:flex;align-items:center;gap:12px;flex-wrap:wrap}[hidden]{display:none!important}</style>
<header><div class="row status-row"><div id="status" role="status" aria-live="polite"><strong>正在打开学校网站…</strong><p>账号密码会自动填入；遇到验证码时只需完成验证。登录后在这里选择真实学期。</p></div><button id="refresh" type="button">重新读取学期</button><button id="close" type="button">关闭 / 取消</button></div>
<div class="row"><label>学校学期<select id="term" disabled><option value="">完成登录后读取学校列表</option></select></label><label>第一教学周周一<input id="first-monday" type="date" required disabled></label><button id="capture" type="button" class="primary" disabled>读取所选学期整学期课表</button></div>
<p id="term-note">只读取本科生“我的课表”，不会使用网页当前默认学期。课程先预览，确认后才写入本地。</p>
<div id="confirmation"><label><input id="term-confirmed" type="checkbox" disabled>我已核对所选学期名称与第一教学周日期</label><label id="summer-note" hidden><input id="summer-confirmed" type="checkbox">我确实要导入暑期 / 短学期</label></div>
<p>读取整学期课程并略过已结束的课次；不会在软件启动时自动联网抓取。密码只在本次登录期间使用，关闭窗口即清除。</p></header><script src="seu-import-ui.cjs"></script></html>
